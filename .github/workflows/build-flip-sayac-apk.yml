name: Build Flip Sayac APK

on:
  push:
    branches:
      - build/flip-sayac-apk
    paths:
      - "FlipSayacAndroid/**"
      - ".github/workflows/build-flip-sayac-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: FlipSayacAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: test -s FlipSayacAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Flip-Sayac-APK
          path: FlipSayacAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
