name: Build Zikir Vakti ARM64 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: test -d "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - name: Extract project source
        run: |
          base64 --decode zikir-vakti-source.b64 > zikir-vakti-project.zip
          mkdir app-project
          unzip -q zikir-vakti-project.zip -d app-project
          test -f app-project/package.json
      - name: Install JavaScript packages
        working-directory: app-project
        run: npm ci --no-audit --no-fund
      - name: Generate Android project with offline bundle setting
        working-directory: app-project
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("app.json")
          config = json.loads(path.read_text())
          config["expo"]["android"]["versionCode"] = 4
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
          npx expo prebuild --platform android
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          marker = "react {"
          if marker not in content:
              raise SystemExit("React Native Gradle configuration was not found")
          content = content.replace(marker, marker + "\n    // Embed the JavaScript bundle so the APK runs without Metro.\n    debuggableVariants = []", 1)
          default = "defaultConfig {"
          if default not in content:
              raise SystemExit("Android defaultConfig was not found")
          content = content.replace(default, default + "\n        ndk { abiFilters \"arm64-v8a\" }", 1)
          gradle.write_text(content)
          PY
      - name: Build ARM64 APK and verify bundled JavaScript
        working-directory: app-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -p "$APK" assets/index.android.bundle > "$RUNNER_TEMP/index.android.bundle"
          test -s "$RUNNER_TEMP/index.android.bundle"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libhermes.so'
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libhermes.so'; then
            echo "Unexpected 32-bit libraries found in the ARM64 APK"
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zikir-vakti-arm64-offline-apk
          path: app-project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
