name: Build Minik Kesif APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-minik-kesif-apk.yml'
      - 'Minik-Kesif/minik-kesif-source.b64'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode source
        run: |
          base64 -d Minik-Kesif/minik-kesif-source.b64 > source.zip
          mkdir app
          unzip -q source.zip -d app
      - name: Install dependencies
        working-directory: app/minik-kesif
        run: npm install --no-audit --no-fund
      - name: Prepare Android project
        working-directory: app/minik-kesif
        run: npx expo prebuild --platform android --clean
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -d /usr/local/lib/android/sdk/platform-tools
      - name: Build standalone release APK
        working-directory: app/minik-kesif/android
        run: ./gradlew assembleRelease
      - name: Verify APK contains app bundle
        run: |
          APK=app/minik-kesif/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          ls -lh "$APK"
      - name: Test APK startup on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/minik-kesif/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.minikkesif.oyunlar 1
            sleep 10
            adb logcat -d -v time > "$RUNNER_TEMP/minik-kesif-logcat.txt"
            adb shell pidof com.minikkesif.oyunlar > "$RUNNER_TEMP/minik-kesif-app-pid.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minik-kesif-android10-launch-logcat
          path: |
            ${{ runner.temp }}/minik-kesif-logcat.txt
            ${{ runner.temp }}/minik-kesif-app-pid.txt
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minik-kesif-standalone-release-apk
          path: app/minik-kesif/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
