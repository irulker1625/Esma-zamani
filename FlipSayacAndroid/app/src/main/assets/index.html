<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap">
<title>Flip Sayaç</title>
<style>
:root{--bg1:#f4f3f2;--bg2:#cfcdca;--num:#f3f3f1;--d:.14s;--btn:#1c1c1c;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none}
body{background:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px}
.pair{position:relative;display:flex;gap:var(--g,12px);--w:min(27vw,200px)}
.pair.small{--w:min(8vw,36px);--g:1px;--r:7px}
.pair.small .knob{display:none}
.totalrow{display:flex;align-items:center;gap:10px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
#reset{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:20;font-size:14px;padding:9px 16px;opacity:.85}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30}
.ov.show{display:flex}
.dlg{background:#fff;border-radius:20px;padding:22px;width:min(80vw,300px);text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.dlg p{margin:0 0 18px;font-size:17px;font-weight:700;color:#222}
.dlg .bt{display:flex;gap:10px}
.dlg button{flex:1;padding:12px 0;font-size:16px;box-shadow:none}
#ok{background:#c8142b;color:#fff}
#no{background:#e9e8e6;color:#222}
.lbl{font-size:15px;font-weight:700;color:#444;letter-spacing:.5px}
.pair.small::after{bottom:-9px;height:9px}
.pair::after{content:"";position:absolute;left:4%;right:4%;bottom:-26px;height:26px;background:radial-gradient(ellipse at center,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);filter:blur(5px);z-index:-1}
.card{position:relative;width:var(--w);aspect-ratio:270/430;perspective:1000px}
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden;backface-visibility:hidden}
.top{top:0;border-radius:var(--r,22px) var(--r,22px) 0 0;transform-origin:bottom;background:linear-gradient(#2b2b2b,#1b1b1b);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),inset 0 -14px 16px -10px rgba(0,0,0,.7)}
.bot{bottom:0;border-radius:0 0 var(--r,22px) var(--r,22px);transform-origin:top;background:linear-gradient(#141414,#222);box-shadow:inset 0 14px 16px -10px rgba(0,0,0,.65),inset 0 -2px 0 rgba(255,255,255,.07)}
.half::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.num{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;color:var(--num);font-weight:700;font-size:calc(var(--w)*.8);line-height:1;text-shadow:0 3px 5px rgba(0,0,0,.55)}
.top .num{top:0}.bot .num{bottom:0}
.flap{display:none}
.go .flap{display:block}
.go .f-top{animation:ft var(--d) ease-in forwards}
.go .f-bot{transform:rotateX(90deg);animation:fb var(--d) var(--d) ease-out forwards}
.go .f-top::after{animation:sh1 var(--d) ease-in forwards}
.go .f-bot::after{opacity:.6;animation:sh2 var(--d) var(--d) ease-out forwards}
.go .s-bot::after{animation:sh3 var(--d) ease-in forwards}
.go .s-top::after{opacity:.55;animation:sh2 var(--d) ease-in forwards}
@keyframes ft{to{transform:rotateX(-90deg)}}
@keyframes fb{to{transform:rotateX(0)}}
@keyframes sh1{to{opacity:.6}}
@keyframes sh2{to{opacity:0}}
@keyframes sh3{to{opacity:.55}}
.hinge{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:linear-gradient(#000,#050505 50%,#2a2a2a);z-index:5}
.knob{position:absolute;top:50%;width:var(--kw,12px);height:var(--kh,46px);margin-top:calc(var(--kh,46px)/-2);z-index:6;background:linear-gradient(90deg,#4a0710,#b3122a 28%,#ff4d5e 48%,#c8142b 68%,#5c0a14);box-shadow:0 2px 5px rgba(90,0,10,.45)}
.card.a .knob{left:calc(var(--kw,12px)*-1);border-radius:6px 2px 2px 6px}
.card.b .knob{right:calc(var(--kw,12px)*-1);border-radius:2px 6px 6px 2px}
.card.a .knob.r,.card.b .knob.l{display:none}
.pair>.knob.mid{left:50%;transform:translateX(-50%);border-radius:6px;z-index:7}
.card.m .knob{display:none}
#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:20;width:44px;height:38px;padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;opacity:.9}
#mb i{width:20px;height:2.5px;background:#fff;border-radius:2px}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none}.sc.show{display:block}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(80vw,320px);background:#fff;z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:6px 0 24px rgba(0,0,0,.3);padding:calc(env(safe-area-inset-top,0px) + 18px) 0 20px;overflow-y:auto;touch-action:pan-y}
.dr.show{transform:none}
.dr .it{display:block;width:100%;text-align:start;background:none;box-shadow:none;color:#222;border-radius:0;padding:15px 22px;font-size:17px}
.dr .hd{font-weight:700}
#hr{color:#c8142b}
.sub{display:none;background:#f6f5f3}.sub.show{display:block}
.sub .it{padding-left:38px;font-size:16px;font-weight:600}.sub .it.off{opacity:.45}
.pg{position:fixed;inset:0;background:#fff;z-index:50;overflow-y:auto;touch-action:pan-y;display:none}.pg.show{display:block}
.pt{position:sticky;top:0;background:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;font-weight:700;font-size:18px;color:#222;z-index:2}
.pt button{width:40px;height:36px;padding:0;font-size:18px}
.ar{direction:rtl;font-family:"Amiri Quran",Amiri,"Noto Naskh Arabic","Traditional Arabic","Geeza Pro",serif;color:#111}
.ay{padding:14px 20px;border-bottom:1px solid #f0efed}.ay .ar{font-size:28px;line-height:2.1}.ay small{font-size:14px;color:#aaa}
.nm{display:flex;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid #f0efed}
.nm b{color:#c8142b;width:26px;font-size:14px}.nm .ar{font-size:30px;min-width:100px;text-align:center}
.nm span{display:block}.nm .t{font-weight:700;color:#222}.nm .m{font-size:14px;color:#666}
.pg.mus{background:#fdf0d5}
.mus .pt{background:#fdf0d5;border-bottom:1px solid #cdb98a}
.mf{margin:26px 22px 40px;padding:14px 12px 22px;background:#fdf0d5;border:2px solid #8a7144;box-shadow:0 0 0 5px #fdf0d5,0 0 0 8px #8a7144,inset 0 0 0 4px #fdf0d5,inset 0 0 0 6px #b9a273}
.sn{border:2px solid #8a7144;border-radius:10px;background:#f6e4b8;padding:6px;text-align:center;font-size:26px;margin-bottom:8px}
.bs{text-align:center;font-size:28px;margin:4px 0}
.tx{font-size:clamp(26px,7.2vw,34px);line-height:2.3;text-align:justify;text-align-last:center}
.vn{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:#8a7144;color:#fdf0d5;font-size:.46em;margin:0 .5em;vertical-align:middle;line-height:1}
.row{display:flex;gap:14px;align-items:center}
*{-webkit-tap-highlight-color:transparent}
button,.card,.pair{outline:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus,button:focus-visible{outline:none}
button{touch-action:manipulation;border:0;cursor:pointer;font-weight:700;border-radius:999px;background:var(--btn);color:var(--btnt);box-shadow:0 6px 14px rgba(0,0,0,.25)}
button:active{transform:scale(.96)}
#next{width:var(--bs,120px);height:var(--bs,120px);padding:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff6b7a,#d4182c 48%,#8f0c1a);box-shadow:0 8px 18px rgba(143,12,26,.45),inset 0 -4px 8px rgba(0,0,0,.25)}
.sec{font-size:16px;padding:12px 20px;opacity:.8}
@media (orientation:landscape) and (max-height:500px){
.row{display:none}
body{gap:0}
.pair{--w:min(34vh,160px)}
.pair.small{--w:min(9vh,34px)}
.totalrow{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
}
</style>
</head>

<div class="pair" id="pair"></div>
<div class="row">
  <button id="next" aria-label="İleri"></button>
</div>

<div class="sc" id="sc"></div>
<div class="dr" id="dr"><button class="it hd" id="hq">Kur'an-ı Kerim ▾</button><div class="sub" id="sq"></div><button class="it hd" id="he">Esmaül Hüsna</button><button class="it hd" id="hr"></button><button class="it hd" id="hl"></button><div class="sub" id="sl"></div></div>
<div class="pg" id="pg"><div class="pt"><button id="pb">←</button><span id="ptt"></span></div><div id="pc"></div></div>
<button id="reset">Sıfırla</button>
<div class="ov" id="ov"><div class="dlg"><p>Sayaç sıfırlansın mı?</p><div class="bt"><button id="no">Vazgeç</button><button id="ok">Evet, sıfırla</button></div></div></div>
<div class="totalrow"><span class="lbl">Toplam</span><div class="pair small" id="total"></div></div>
<script>
function Card(v){
  var c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="half top s-top"><div class="num"></div></div><div class="half bot s-bot"><div class="num"></div></div><div class="half top flap f-top"><div class="num"></div></div><div class="half bot flap f-bot"><div class="num"></div></div><div class="hinge"></div><div class="knob l"></div><div class="knob r"></div>';
  var q=function(s){return c.querySelector(s+' .num')};
  var sT=q('.s-top'),sB=q('.s-bot'),fT=q('.f-top'),fB=q('.f-bot');
  var self={el:c};
  [sT,sB,fT,fB].forEach(function(e){e.textContent=v});
  var cur=v,timer=null;
  function finish(){clearTimeout(timer);sT.textContent=cur;sB.textContent=cur;c.classList.remove('go')}
  self.set=function(nv){
    if(nv===cur)return;
    finish();
    sT.textContent=nv;fT.textContent=cur;fB.textContent=nv;
    void c.offsetWidth;c.classList.add('go');
    var t=nv;cur=nv;
    timer=setTimeout(function(){sB.textContent=t;c.classList.remove('go')},300);
  };
  return self;
}
function Counter(host,digits,val){
  var cs=[],i;
  function split(n){var a=[],k;for(k=digits-1;k>=0;k--)a.push(Math.floor(n/Math.pow(10,k))%10);return a}
  var d=split(val);
  for(i=0;i<digits;i++){var c=Card(d[i]);c.el.classList.add(i===0?'a':i===digits-1?'b':'m');host.appendChild(c.el);cs.push(c)}
  for(i=1;i<digits;i++){var m=document.createElement('div');m.className='knob mid';m.style.left='calc(var(--w)*'+i+' + var(--g,12px)*'+(i-1)+' + var(--g,12px)/2)';host.appendChild(m)}
  return {set:function(n){var a=split(n);for(var k=0;k<digits;k++)cs[k].set(a[k])}};
}
var n=9,total=0,TK='flip-total';
try{var t0=parseInt(localStorage.getItem(TK),10);if(t0>=0&&t0<100000)total=t0}catch(e){}
function saveTotal(){try{localStorage.setItem(TK,String(total))}catch(e){}}
var main=Counter(document.getElementById('pair'),3,n),tot=Counter(document.getElementById('total'),5,total);
function go(v){n=((v%1000)+1000)%1000;main.set(n)}
var nextBtn=document.getElementById('next');
nextBtn.onclick=function(){if(Date.now()-lastPinch<350)return;total=(total+1)%100000;tot.set(total);saveTotal();go(n+1)};
var ov=document.getElementById('ov');
var pend=null;
function ask(m,f){document.querySelector('.dlg p').textContent=m;pend=f;ov.classList.add('show')}
document.getElementById('reset').onclick=function(){ask(L('c1'),function(){go(0)})};
document.getElementById('hr').onclick=function(){openDr(false);ask(L('c2'),function(){total=0;tot.set(0);saveTotal()})};
document.getElementById('no').onclick=function(){ov.classList.remove('show')};
document.getElementById('ok').onclick=function(){ov.classList.remove('show');if(pend)pend();pend=null};
var size=120,KEY='flip-bs',ptrs={},d0=0,s0=0,lastPinch=0;
try{var sv=parseFloat(localStorage.getItem(KEY));if(sv>=56&&sv<=300)size=sv}catch(e){}
function setSize(v){size=Math.max(56,Math.min(300,v));document.documentElement.style.setProperty('--bs',size+'px')}
function saveSize(){try{localStorage.setItem(KEY,String(size))}catch(e){}}
function dist(){var k=Object.keys(ptrs),a=ptrs[k[0]],b=ptrs[k[1]];return Math.hypot(a.x-b.x,a.y-b.y)}
setSize(size);
document.addEventListener('pointerdown',function(e){ptrs[e.pointerId]={x:e.clientX,y:e.clientY};if(Object.keys(ptrs).length===2){d0=dist();s0=size;lastPinch=Date.now()}});
document.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId])return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};if(Object.keys(ptrs).length===2&&d0>10){setSize(s0*dist()/d0);lastPinch=Date.now()}});
function up(e){var was=Object.keys(ptrs).length;delete ptrs[e.pointerId];if(was>=2){lastPinch=Date.now();saveSize()}}
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
nextBtn.addEventListener('wheel',function(e){e.preventDefault();setSize(size*(e.deltaY<0?1.06:.94));saveSize()},{passive:false});
var SUR={
"Fâtiha":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَٰنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"],
"İhlâs":["قُلْ هُوَ اللَّهُ أَحَدٌ","اللَّهُ الصَّمَدُ","لَمْ يَلِدْ وَلَمْ يُولَدْ","وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ"],

"Kevser":["إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرْ","إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ"],
"Asr":["وَالْعَصْرِ","إِنَّ الْإِنسَانَ لَفِي خُسْرٍ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ"],
"Nasr":["إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا"]};

لْمُكْرَمِينَ", "وَمَا أَنْزَلْنَا عَلَىٰ قَوْمِهِ مِنْ بَعْدِهِ مِنْ جُنْدٍ مِنَ السَّمَاءِ وَمَا كُنَّا مُنْزِلِينَ", "إِنْ كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ خَامِدُونَ", "يَا حَسْرَةً عَلَى الْعِبَادِ ۚ مَا يَأْتِيهِمْ مِنْ رَسُولٍ إِلَّا كَانُوا بِهِ يَسْتَهْزِئُونَ", "أَلَمْ يَرَوْا كَمْ أَهْلَكْنَا قَبْلَهُمْ مِنَ الْقُرُونِ أَنَّهُمْ إِلَيْهِمْ لَا يَرْجِعُونَ", "وَإِنْ كُلٌّ لَمَّا جَمِيعٌ لَدَيْنَا مُحْضَرُونَ", "وَآيَةٌ لَهُمُ الْأَرْضُ الْمَيْتَةُ أَحْيَيْنَاهَا وَأَخْرَجْنَا مِنْهَا حَبًّا فَمِنْهُ يَأْكُلُونَ", "وَجَعَلْنَا فِيهَا جَنَّاتٍ مِنْ نَخِيلٍ وَأَعْنَابٍ وَفَجَّرْنَا فِيهَا مِنَ الْعُيُونِ", "لِيَأْكُلُوا مِنْ ثَمَرِهِ وَمَا عَمِلَتْهُ أَيْدِيهِمْ ۖ أَفَلَا يَشْكُرُونَ", "سُبْحَانَ الَّذِي خَلَقَ الْأَزْوَاجَ كُلَّهَا مِمَّا تُنْبِتُ الْأَرْضُ وَمِنْ أَنْفُسِهِمْ وَمِمَّا لَا يَعْلَمُونَ", "وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُمْ مُظْلِمُونَ", "وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَهَا ۚ ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ", "وَالْقَمَرَ قَدَّرْنَاهُ مَنَازِلَ حَتَّىٰ عَادَ كَالْعُرْجُونِ الْقَدِيمِ", "لَا الشَّمْسُ يَنْبَغِي لَهَا أَنْ تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سَابِقُ النَّهَارِ ۚ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ", "وَآيَةٌ لَهُمْ أَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِي الْفُلْكِ الْمَشْحُونِ", "وَخَلَقْنَا لَهُمْ مِنْ مِثْلِهِ مَا يَرْكَبُونَ", "وَإِنْ نَشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنْقَذُونَ", "إِلَّا رَحْمَةً مِنَّا وَمَتَاعًا إِلَىٰ حِينٍ", "وَإِذَا قِيلَ لَهُمُ اتَّقُوا مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ", "وَمَا تَأْتِيهِمْ مِنْ آيَةٍ مِنْ آيَاتِ رَبِّهِمْ إِلَّا كَانُوا عَنْهَا مُعْرِضِينَ", "وَإِذَا قِيلَ لَهُمْ أَنْفِقُوا مِمَّا رَزَقَكُمُ اللَّهُ قَالَ الَّذِينَ كَفَرُوا لِلَّذِينَ آمَنُوا أَنُطْعِمُ مَنْ لَوْ يَشَاءُ اللَّهُ أَطْعَمَهُ إِنْ أَنْتُمْ إِلَّا فِي ضَلَالٍ مُبِينٍ", "وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ", "مَا يَنْظُرُونَ إِلَّا صَيْحَةً وَاحِدَةً تَأْخُذُهُمْ وَهُمْ يَخِصِّمُونَ", "فَلَا يَسْتَطِيعُونَ تَوْصِيَةً وَلَا إِلَىٰ أَهْلِهِمْ يَرْجِعُونَ", "وَنُفِخَ فِي الصُّورِ فَإِذَا هُمْ مِنَ الْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنْسِلُونَ", "قَالُوا يَا وَيْلَنَا مَنْ بَعَثَنَا مِنْ مَرْقَدِنَا ۜ هَٰذَا مَا وَعَدَ الرَّحْمَٰنُ وَصَدَقَ الْمُرْسَلُونَ", "إِنْ كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ جَمِيعٌ لَدَيْنَا مُحْضَرُونَ", "فَالْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْئًا وَلَا تُجْزَوْنَ إِلَّا مَا كُنْتُمْ تَعْمَلُونَ", "إِنَّ أَصْحَابَ الْجَنَّةِ الْيَوْمَ فِي شُغُلٍ فَاكِهُونَ", "هُمْ وَأَزْوَاجُهُمْ فِي ظِلَالٍ عَلَى الْأَرَائِكِ مُتَّكِئُونَ", "لَهُمْ فِيهَا فَاكِهَةٌ وَلَهُمْ مَا يَدَّعُونَ", "سَلَامٌ قَوْلًا مِنْ رَبٍّ رَحِيمٍ", "وَامْتَازُوا الْيَوْمَ أَيُّهَا الْمُجْرِمُونَ", "أَلَمْ أَعْهَدْ إِلَيْكُمْ يَا بَنِي آدَمَ أَنْ لَا تَعْبُدُوا الشَّيْطَانَ ۖ إِنَّهُ لَكُمْ عَدُوٌّ مُبِينٌ", "وَأَنِ اعْبُدُونِي ۚ هَٰذَا صِرَاطٌ مُسْتَقِيمٌ", "وَلَقَدْ أَضَلَّ مِنْكُمْ جِبِلًّا كَثِيرًا ۖ أَفَلَمْ تَكُونُوا تَعْقِلُونَ", "هَٰذِهِ جَهَنَّمُ الَّتِي كُنْتُمْ تُوعَدُونَ", "اصْلَوْهَا الْيَوْمَ بِمَا كُنْتُمْ تَكْفُرُونَ", "الْيَوْمَ نَخْتِمُ عَلَىٰ أَفْوَاهِهِمْ وَتُكَلِّمُنَا أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُمْ بِمَا كَانُوا يَكْسِبُونَ", "وَلَوْ نَشَاءُ لَطَمَسْنَا عَلَىٰ أَعْيُنِهِمْ فَاسْتَبَقُوا الصِّرَاطَ فَأَنَّىٰ يُبْصِرُونَ", "وَلَوْ نَشَاءُ لَمَسَخْنَاهُمْ عَلَىٰ مَكَانَتِهِمْ فَمَا اسْتَطَاعُوا مُضِيًّا وَلَا يَرْجِعُونَ", "وَمَنْ نُعَمِّرْهُ نُنَكِّسْهُ فِي الْخَلْقِ ۖ أَفَلَا يَعْقِلُونَ", "وَمَا عَلَّمْنَاهُ الشِّعْرَ وَمَا يَنْبَغِي لَهُ ۚ إِنْ هُوَ إِلَّا ذِكْرٌ وَقُرْآنٌ مُبِينٌ", "لِيُنْذِرَ مَنْ كَانَ حَيًّا وَيَحِقَّ الْقَوْلُ عَلَى الْكَافِرِينَ", "أَوَلَمْ يَرَوْا أَنَّا خَلَقْنَا لَهُمْ مِمَّا عَمِلَتْ أَيْدِينَا أَنْعَامًا فَهُمْ لَهَا مَالِكُونَ", "وَذَلَّلْنَاهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَأْكُلُونَ", "وَلَهُمْ فِيهَا مَنَافِعُ وَمَشَارِبُ ۖ أَفَلَا يَشْكُرُونَ", "وَاتَّخَذُوا مِنْ دُونِ اللَّهِ آلِهَةً لَعَلَّهُمْ يُنْصَرُونَ", "لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُنْدٌ مُحْضَرُونَ", "فَلَا يَحْزُنْكَ قَوْلُهُمْ ۘ function buildSub(){

    var b=document.createElement('button');b.className='it';
    if(SUR[k]){b.textContent=nm(k);b.onclick=function(){var v=SUR[k],f=k==='Fâtiha';showPg(nm(k),'<div class="mf"><div class="sn ar">'+ARN[k]+'</div><div class="bs ar">'+BIS+(f?' <span class="vn">'+ad(1)+'</span>':'')+'</div><div class="tx ar">'+(f?v.slice(1):v).map(function(a,i){return a+' <span class="vn">'+ad(i+(f?2:1))+'</span>'}).join(' ')+'</div></div>','mus')}}

    sq.appendChild(b)})}
var sl=document.getElementById('sl');
LANGS.forEach(function(x){var b=document.createElement('button');b.className='it';b.textContent=x[1];b.onclick=function(){lang=x[0];try{localStorage.setItem('flip-lang',lang)}catch(e){}applyLang();sl.classList.remove('show')};sl.appendChild(b)});
document.getElementById('hl').onclick=function(){sl.classList.toggle('show')};
function applyLang(){
  var g=function(i,t){document.getElementById(i).textContent=t};
  g('hq',L('q')+' ▾');g('he',L('e'));g('hr',L('x'));g('hl',L('l')+' ▾');g('reset',L('r'));g('no',L('no'));g('ok',L('ok'));

  var d=(lang==='ar'||lang==='ur')?'rtl':'ltr';dr.dir=d;ov.dir=d;

sc.onclick=function(){openDr(false)};
document.getElementById('hq').onclick=function(){sq.classList.toggle('show')};
document.getElementById('he').onclick=function(){showPg('Esmaül Hüsna',ESMA.map(function(l,i){var a=l.split('|');return '<div class="nm"><b>'+(i+1)+'</b><div class="ar">'+a[0]+'</div><div><span class="t">'+a[1]+'</span><span class="m">'+(MEAN[lang]&&MEAN[lang][i]||a[2])+'</span></div></div>'}).join(''))};

applyLang();
var LAND=window.matchMedia('(orientation:landscape) and (max-height:500px)');
document.addEventListener('click',function(e){
  if(!LAND.matches)return;
  if(e.target.closest('button,.dr,.ov,.pg,.sc'))return;
  nextBtn.onclick();
});
