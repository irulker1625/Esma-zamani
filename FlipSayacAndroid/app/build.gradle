plugins {
    id 'com.android.application'
}

android {
    namespace 'com.irulker.flipsayac'
    compileSdk 35

    defaultConfig {
        applicationId 'com.irulker.flipsayac'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
